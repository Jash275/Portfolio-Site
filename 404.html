<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>404 - Page Not Found | Jash Jivani</title>
  <meta name="description" content="The page you requested could not be found. Return to Jash Jivani's portfolio.">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Open Graph -->
  <meta property="og:title" content="404 - Page Not Found | Jash Jivani">
  <meta property="og:description" content="Return to Jash Jivani's personal portfolio.">
  <meta property="og:image" content="assets/images/profile.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Raleway:wght@700&display=swap" rel="stylesheet">
  <link href="assets/vendor/boxicons/css/boxicons.min.css" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at 50% 30%, #0a1f38 0%, #040d1a 80%);
      color: #ffffff;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .error-container {
      max-width: 540px;
      padding: 40px 30px;
      background: #09203a;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    }
    .error-code {
      font-family: 'Raleway', sans-serif;
      font-size: 88px;
      font-weight: 800;
      line-height: 1;
      color: #12d640;
      text-shadow: 0 0 25px rgba(18, 214, 64, 0.35);
      margin-bottom: 12px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 12px;
      color: #ffffff;
    }
    p {
      color: rgba(255, 255, 255, 0.75);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #12d640;
      color: #040d1a;
      font-weight: 700;
      font-size: 15px;
      padding: 12px 28px;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.25s ease;
      min-height: 44px;
    }
    .btn-home:hover {
      background: #00ff87;
      box-shadow: 0 6px 20px rgba(18, 214, 64, 0.4);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you are looking for does not exist or has been moved. Explore projects, experience, and contact details on my main site.</p>
    <a href="index.html" class="btn-home">
      <i class="bx bx-home-alt"></i> Back to Home
    </a>
  </div>
</body>
</html>
