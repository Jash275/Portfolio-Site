<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="finGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1526"/>
      <stop offset="50%" stop-color="#141e30"/>
      <stop offset="100%" stop-color="#070d18"/>
    </linearGradient>
    <filter id="finGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#finGrad)"/>

  <!-- Radar Conic Circle Grid -->
  <g stroke="rgba(18,214,64,0.15)" stroke-width="1" fill="none">
    <circle cx="300" cy="170" r="130"/>
    <circle cx="300" cy="170" r="95"/>
    <circle cx="300" cy="170" r="60"/>
    <circle cx="300" cy="170" r="25"/>
    <line x1="300" y1="40" x2="300" y2="300"/>
    <line x1="170" y1="170" x2="430" y2="170"/>
    <line x1="208" y1="78" x2="392" y2="262"/>
    <line x1="208" y1="262" x2="392" y2="78"/>
  </g>

  <!-- Radar Scanning Beam -->
  <path d="M300 170 L420 120 A130 130 0 0 0 350 50 Z" fill="rgba(18,214,64,0.18)"/>

  <!-- Normal Data Points (Emerald dots) -->
  <g fill="#12d640" opacity="0.6">
    <circle cx="280" cy="160" r="3"/>
    <circle cx="310" cy="185" r="3.5"/>
    <circle cx="295" cy="140" r="3"/>
    <circle cx="325" cy="155" r="3"/>
    <circle cx="270" cy="175" r="4"/>
    <circle cx="305" cy="195" r="3"/>
    <circle cx="335" cy="175" r="3"/>
    <circle cx="260" cy="150" r="3.5"/>
    <circle cx="285" cy="200" r="3"/>
    <circle cx="315" cy="135" r="3.5"/>
    <circle cx="275" cy="130" r="3"/>
  </g>

  <!-- Anomalies Outliers (Glowing Red/Amber) -->
  <g filter="url(#finGlow)">
    <circle cx="380" cy="85" r="8" fill="#ff3366"/>
    <circle cx="380" cy="85" r="14" fill="none" stroke="#ff3366" stroke-width="2"/>

    <circle cx="210" cy="105" r="7" fill="#ff9900"/>
    <circle cx="210" cy="105" r="12" fill="none" stroke="#ff9900" stroke-width="1.5"/>

    <circle cx="395" cy="235" r="8" fill="#ff3366"/>
    <circle cx="395" cy="235" r="15" fill="none" stroke="#ff3366" stroke-width="2"/>
  </g>

  <!-- Callout Tag -->
  <g transform="translate(385, 45)">
    <rect width="130" height="28" rx="6" fill="#1b0c16" stroke="#ff3366" stroke-width="1.5"/>
    <text x="65" y="18" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#ff5376" text-anchor="middle">ANOMALY FLAGGED</text>
  </g>

  <!-- Metric Badges -->
  <g transform="translate(45, 320)">
    <rect width="150" height="36" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(18,214,64,0.3)"/>
    <text x="75" y="23" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#12d640" text-anchor="middle">217K+ TRANSACTIONS</text>
  </g>

  <g transform="translate(225, 320)">
    <rect width="150" height="36" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,51,102,0.3)"/>
    <text x="75" y="23" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#ff5376" text-anchor="middle">ISOLATION FOREST</text>
  </g>

  <g transform="translate(405, 320)">
    <rect width="150" height="36" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(0,229,255,0.3)"/>
    <text x="75" y="23" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#00e5ff" text-anchor="middle">POWER BI DASHBOARD</text>
  </g>
</svg>
