<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="auditGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192e"/>
      <stop offset="50%" stop-color="#0e2a47"/>
      <stop offset="100%" stop-color="#051329"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12d640"/>
      <stop offset="100%" stop-color="#00ff87"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#193b68"/>
      <stop offset="100%" stop-color="#0e2342"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#auditGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="50" x2="600" y2="50"/>
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="250" x2="600" y2="250"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="350" x2="600" y2="350"/>
    <line x1="75" y1="0" x2="75" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="225" y1="0" x2="225" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="375" y1="0" x2="375" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
    <line x1="525" y1="0" x2="525" y2="400"/>
  </g>

  <!-- Glow orb -->
  <circle cx="300" cy="180" r="120" fill="#12d640" opacity="0.12" filter="url(#glow)"/>

  <!-- Audit Risk Matrix Graphic -->
  <g transform="translate(180, 70)">
    <!-- Central Security Shield -->
    <path d="M120 40 L180 70 L180 150 C180 200 120 230 120 230 C120 230 60 200 60 150 L60 70 Z" 
          fill="url(#shieldGrad)" stroke="#12d640" stroke-width="3" filter="url(#glow)"/>
    
    <!-- Keyhole & Access Checkmark -->
    <circle cx="120" cy="115" r="18" fill="none" stroke="#00ff87" stroke-width="3"/>
    <path d="M110 160 L130 160 L125 130 L115 130 Z" fill="#00ff87"/>
    <path d="M108 115 L116 123 L134 105" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

    <!-- Orbiting Access Nodes -->
    <circle cx="30" cy="90" r="14" fill="#0b1d3a" stroke="#12d640" stroke-width="2"/>
    <circle cx="30" cy="90" r="5" fill="#12d640"/>
    <line x1="44" y1="95" x2="65" y2="110" stroke="rgba(18,214,64,0.5)" stroke-width="2" stroke-dasharray="4"/>

    <circle cx="210" cy="90" r="14" fill="#0b1d3a" stroke="#12d640" stroke-width="2"/>
    <circle cx="210" cy="90" r="5" fill="#12d640"/>
    <line x1="196" y1="95" x2="175" y2="110" stroke="rgba(18,214,64,0.5)" stroke-width="2" stroke-dasharray="4"/>

    <circle cx="45" cy="190" r="14" fill="#0b1d3a" stroke="#ff5252" stroke-width="2"/>
    <circle cx="45" cy="190" r="5" fill="#ff5252"/>
    <line x1="58" y1="182" x2="80" y2="170" stroke="rgba(255,82,82,0.5)" stroke-width="2" stroke-dasharray="4"/>

    <circle cx="195" cy="190" r="14" fill="#0b1d3a" stroke="#ffb703" stroke-width="2"/>
    <circle cx="195" cy="190" r="5" fill="#ffb703"/>
    <line x1="182" y1="182" x2="160" y2="170" stroke="rgba(255,183,3,0.5)" stroke-width="2" stroke-dasharray="4"/>
  </g>

  <!-- Metric Badges -->
  <g transform="translate(60, 320)">
    <rect width="140" height="36" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(18,214,64,0.3)"/>
    <text x="70" y="23" font-family="'Poppins', sans-serif" font-size="13" font-weight="600" fill="#12d640" text-anchor="middle">2,398 ACCOUNTS</text>
  </g>

  <g transform="translate(230, 320)">
    <rect width="140" height="36" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(18,214,64,0.3)"/>
    <text x="70" y="23" font-family="'Poppins', sans-serif" font-size="13" font-weight="600" fill="#00e5ff" text-anchor="middle">5×5 RISK MATRIX</text>
  </g>

  <g transform="translate(400, 320)">
    <rect width="140" height="36" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(18,214,64,0.3)"/>
    <text x="70" y="23" font-family="'Poppins', sans-serif" font-size="13" font-weight="600" fill="#ffb703" text-anchor="middle">DAX RISK SCORE</text>
  </g>
</svg>
