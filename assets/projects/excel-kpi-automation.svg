<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="excelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08201a"/>
      <stop offset="50%" stop-color="#0f3327"/>
      <stop offset="100%" stop-color="#041410"/>
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#12d640"/>
      <stop offset="100%" stop-color="#00ff87"/>
    </linearGradient>
    <filter id="excelGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#excelGrad)"/>

  <!-- Subtle Matrix Pattern -->
  <g stroke="rgba(18,214,64,0.06)" stroke-width="1">
    <line x1="0" y1="40" x2="600" y2="40"/>
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="280" x2="600" y2="280"/>
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
    <line x1="560" y1="0" x2="560" y2="400"/>
  </g>

  <!-- Central Automation & Data Pipeline Graphic -->
  <g transform="translate(100, 70)">
    <!-- Pipeline track -->
    <path d="M 30 110 L 140 110 L 200 60 L 280 60 L 340 110 L 390 110" fill="none" stroke="url(#pipeGrad)" stroke-width="6" stroke-linecap="round" filter="url(#excelGlow)"/>
    
    <!-- Stage 1: Raw Ingestion -->
    <rect x="0" y="80" width="60" height="60" rx="10" fill="#0c2d22" stroke="#00e5ff" stroke-width="2"/>
    <text x="30" y="115" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#00e5ff" text-anchor="middle">541K</text>
    <text x="30" y="130" font-family="'Poppins', sans-serif" font-size="8" fill="#8ff" text-anchor="middle">RAW ROWS</text>

    <!-- Stage 2: Quality Validation Filter -->
    <circle cx="170" cy="85" r="28" fill="#0f3c2e" stroke="#12d640" stroke-width="2.5"/>
    <path d="M158 85 L167 94 L182 78" fill="none" stroke="#12d640" stroke-width="3" stroke-linecap="round"/>

    <!-- Stage 3: KPI Engine -->
    <rect x="250" y="30" width="60" height="60" rx="10" fill="#0c2d22" stroke="#ffb703" stroke-width="2"/>
    <circle cx="280" cy="55" r="14" fill="none" stroke="#ffb703" stroke-width="2" stroke-dasharray="6"/>
    <path d="M280 47 L280 55 L286 58" stroke="#ffb703" stroke-width="2" stroke-linecap="round"/>
    <text x="280" y="82" font-family="'Poppins', sans-serif" font-size="8" fill="#ffd" text-anchor="middle">KPI ENGINE</text>

    <!-- Stage 4: Formatted Excel Output -->
    <rect x="360" y="70" width="70" height="80" rx="8" fill="#107c41" stroke="#21a366" stroke-width="2"/>
    <rect x="375" y="85" width="40" height="6" rx="2" fill="#ffffff" opacity="0.8"/>
    <rect x="375" y="97" width="40" height="6" rx="2" fill="#ffffff" opacity="0.6"/>
    <rect x="375" y="109" width="40" height="6" rx="2" fill="#ffffff" opacity="0.6"/>
    <rect x="375" y="121" width="40" height="6" rx="2" fill="#ffffff" opacity="0.6"/>
    <circle cx="370" cy="80" r="14" fill="#0c592e" stroke="#ffffff" stroke-width="1.5"/>
    <text x="370" y="85" font-family="'Poppins', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">X</text>
  </g>

  <!-- Flow Arrows / Sparks -->
  <g fill="#12d640">
    <circle cx="200" cy="180" r="4" filter="url(#excelGlow)"/>
    <circle cx="260" cy="155" r="3"/>
    <circle cx="360" cy="180" r="4" filter="url(#excelGlow)"/>
    <circle cx="430" cy="180" r="3"/>
  </g>

  <!-- Metric Badges -->
  <g transform="translate(50, 320)">
    <rect width="145" height="36" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(18,214,64,0.3)"/>
    <text x="72" y="23" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#12d640" text-anchor="middle">541,909 TX PIPELINE</text>
  </g>

  <g transform="translate(225, 320)">
    <rect width="145" height="36" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(0,229,255,0.3)"/>
    <text x="72" y="23" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#00e5ff" text-anchor="middle">PYTHON &amp; PANDAS</text>
  </g>

  <g transform="translate(400, 320)">
    <rect width="145" height="36" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(33,163,102,0.5)"/>
    <text x="72" y="23" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#21a366" text-anchor="middle">OPENPYXL 3-SHEET</text>
  </g>
</svg>
