<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="loanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1e36"/>
      <stop offset="50%" stop-color="#142e50"/>
      <stop offset="100%" stop-color="#071221"/>
    </linearGradient>
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb703" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffb703" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="loanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#loanGrad)"/>

  <!-- Radial Segment Background Grid -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="60" y1="240" x2="540" y2="240"/>
    <line x1="60" y1="180" x2="540" y2="180"/>
    <line x1="60" y1="120" x2="540" y2="120"/>
    <line x1="60" y1="60" x2="540" y2="60"/>
  </g>

  <!-- Risk Concentration Curve & Dial -->
  <g transform="translate(60, 40)">
    <!-- Risk Area Fill -->
    <path d="M 40 200 C 140 190, 220 150, 300 80 C 360 40, 420 50, 460 20 L 460 200 Z" fill="url(#curveGrad)"/>
    <!-- Glowing Line -->
    <path d="M 40 200 C 140 190, 220 150, 300 80 C 360 40, 420 50, 460 20" fill="none" stroke="#ffb703" stroke-width="4" filter="url(#loanGlow)"/>

    <!-- Delinquency Segment Bars -->
    <rect x="90" y="160" width="22" height="40" rx="3" fill="#12d640" opacity="0.85"/>
    <rect x="160" y="140" width="22" height="60" rx="3" fill="#00e5ff" opacity="0.85"/>
    <rect x="230" y="100" width="22" height="100" rx="3" fill="#ffb703" opacity="0.85"/>
    <rect x="300" y="60" width="22" height="140" rx="3" fill="#ff7043" opacity="0.85"/>
    <rect x="370" y="30" width="22" height="170" rx="3" fill="#ff5252" opacity="0.85"/>

    <!-- Target Pin -->
    <circle cx="370" cy="30" r="7" fill="#ffffff" stroke="#ff5252" stroke-width="3" filter="url(#loanGlow)"/>
  </g>

  <!-- Status Chip -->
  <g transform="translate(370, 75)">
    <rect width="165" height="30" rx="6" fill="#241315" stroke="#ff5252" stroke-width="1.5"/>
    <text x="82" y="19" font-family="'Poppins', sans-serif" font-size="10.5" font-weight="700" fill="#ff7b72" text-anchor="middle">HIGH-RISK EXPOSURE FLAGGED</text>
  </g>

  <!-- Metric Badges -->
  <g transform="translate(45, 320)">
    <rect width="150" height="36" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,183,3,0.3)"/>
    <text x="75" y="23" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#ffb703" text-anchor="middle">LOAN RISK ANALYTICS</text>
  </g>

  <g transform="translate(225, 320)">
    <rect width="150" height="36" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,82,82,0.3)"/>
    <text x="75" y="23" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#ff7b72" text-anchor="middle">COLLECTION STRATEGY</text>
  </g>

  <g transform="translate(405, 320)">
    <rect width="150" height="36" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(18,214,64,0.3)"/>
    <text x="75" y="23" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#12d640" text-anchor="middle">PYTHON &amp; SQL</text>
  </g>
</svg>
