<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="movGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120c24"/>
      <stop offset="50%" stop-color="#231342"/>
      <stop offset="100%" stop-color="#0a0517"/>
    </linearGradient>
    <filter id="movGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#movGrad)"/>

  <!-- Film Reel Matrix Pattern -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <rect x="60" y="50" width="480" height="40" rx="4" fill="#180e30"/>
    <circle cx="90" cy="70" r="10" fill="#0c051a"/>
    <circle cx="130" cy="70" r="10" fill="#0c051a"/>
    <circle cx="170" cy="70" r="10" fill="#0c051a"/>
    <circle cx="210" cy="70" r="10" fill="#0c051a"/>
    <circle cx="250" cy="70" r="10" fill="#0c051a"/>
    <circle cx="290" cy="70" r="10" fill="#0c051a"/>
    <circle cx="330" cy="70" r="10" fill="#0c051a"/>
    <circle cx="370" cy="70" r="10" fill="#0c051a"/>
    <circle cx="410" cy="70" r="10" fill="#0c051a"/>
    <circle cx="450" cy="70" r="10" fill="#0c051a"/>
    <circle cx="490" cy="70" r="10" fill="#0c051a"/>
    <circle cx="530" cy="70" r="10" fill="#0c051a"/>
  </g>

  <!-- Central Similarity Vector Map & Movie Cards -->
  <g transform="translate(140, 110)">
    <!-- Movie Card 1 -->
    <rect x="0" y="20" width="85" height="120" rx="8" fill="#2d164d" stroke="#c084fc" stroke-width="2"/>
    <polygon points="35,65 35,95 60,80" fill="#12d640"/>
    <rect x="15" y="115" width="55" height="6" rx="2" fill="#ffffff" opacity="0.6"/>

    <!-- Similarity Vector Bridge (Cosine Similarity curve) -->
    <path d="M 85 80 C 130 30, 190 30, 235 80" fill="none" stroke="#12d640" stroke-width="3" stroke-dasharray="6" filter="url(#movGlow)"/>
    <circle cx="160" cy="48" r="18" fill="#180e30" stroke="#12d640" stroke-width="2"/>
    <text x="160" y="52" font-family="'Poppins', sans-serif" font-size="10" font-weight="700" fill="#12d640" text-anchor="middle">cos θ</text>

    <!-- Movie Card 2 (Recommended) -->
    <rect x="235" y="20" width="85" height="120" rx="8" fill="#2d164d" stroke="#12d640" stroke-width="2.5" filter="url(#movGlow)"/>
    <polygon points="270,65 270,95 295,80" fill="#00e5ff"/>
    <rect x="250" y="115" width="55" height="6" rx="2" fill="#12d640" opacity="0.9"/>
  </g>

  <!-- Match Badge -->
  <g transform="translate(240, 250)">
    <rect width="120" height="28" rx="14" fill="#1a3826" stroke="#12d640" stroke-width="1.5"/>
    <text x="60" y="18" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#12d640" text-anchor="middle">98.4% MATCH</text>
  </g>

  <!-- Metric Badges -->
  <g transform="translate(45, 320)">
    <rect width="150" height="36" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(192,132,252,0.3)"/>
    <text x="75" y="23" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#c084fc" text-anchor="middle">IMDB DATASET</text>
  </g>

  <g transform="translate(225, 320)">
    <rect width="150" height="36" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(18,214,64,0.3)"/>
    <text x="75" y="23" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#12d640" text-anchor="middle">COSINE SIMILARITY</text>
  </g>

  <g transform="translate(405, 320)">
    <rect width="150" height="36" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(0,229,255,0.3)"/>
    <text x="75" y="23" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#00e5ff" text-anchor="middle">PANDAS &amp; SCIKIT</text>
  </g>
</svg>
