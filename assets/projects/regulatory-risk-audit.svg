<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="regGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b2c"/>
      <stop offset="50%" stop-color="#0a2e42"/>
      <stop offset="100%" stop-color="#04121e"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12d640" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#12d640" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="regGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#regGrad)"/>

  <!-- Subtle Grid -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="50" x2="600" y2="50"/>
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="250" x2="600" y2="250"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
  </g>

  <!-- Central Banking & Prudential Regulatory Risk Illustration -->
  <g transform="translate(100, 70)">
    <!-- Bank Pediment / Pillar Outline -->
    <path d="M200 20 L80 60 L320 60 Z" fill="#0d324f" stroke="#00e5ff" stroke-width="2"/>
    <rect x="100" y="65" width="200" height="10" rx="3" fill="#00e5ff" opacity="0.4"/>
    
    <!-- Pillars -->
    <rect x="110" y="80" width="18" height="90" rx="3" fill="#113e61" stroke="rgba(0,229,255,0.4)" stroke-width="1.5"/>
    <rect x="165" y="80" width="18" height="90" rx="3" fill="#113e61" stroke="rgba(0,229,255,0.4)" stroke-width="1.5"/>
    <rect x="220" y="80" width="18" height="90" rx="3" fill="#113e61" stroke="rgba(0,229,255,0.4)" stroke-width="1.5"/>
    <rect x="275" y="80" width="18" height="90" rx="3" fill="#113e61" stroke="rgba(0,229,255,0.4)" stroke-width="1.5"/>

    <!-- Podium -->
    <rect x="90" y="170" width="220" height="15" rx="3" fill="#0d324f" stroke="#00e5ff" stroke-width="2"/>

    <!-- Dynamic RWA / Prudential Control Chart overlay -->
    <path d="M40 220 Q 100 160 170 190 T 290 120 T 360 100" fill="none" stroke="#12d640" stroke-width="4" filter="url(#regGlow)"/>
    <path d="M40 220 Q 100 160 170 190 T 290 120 T 360 100 L 360 230 L 40 230 Z" fill="url(#chartGrad)"/>

    <circle cx="170" cy="190" r="6" fill="#12d640" stroke="#ffffff" stroke-width="2"/>
    <circle cx="290" cy="120" r="6" fill="#00e5ff" stroke="#ffffff" stroke-width="2"/>
    <circle cx="360" cy="100" r="6" fill="#ffb703" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Regulatory Badges -->
  <g transform="translate(50, 320)">
    <rect width="115" height="36" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(0,229,255,0.3)"/>
    <text x="57" y="23" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#00e5ff" text-anchor="middle">CAPITAL / RWA</text>
  </g>

  <g transform="translate(180, 320)">
    <rect width="115" height="36" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(18,214,64,0.3)"/>
    <text x="57" y="23" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#12d640" text-anchor="middle">ICAAP &amp; ILAAP</text>
  </g>

  <g transform="translate(310, 320)">
    <rect width="115" height="36" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,183,3,0.3)"/>
    <text x="57" y="23" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#ffb703" text-anchor="middle">IFRS 9 ECL</text>
  </g>

  <g transform="translate(440, 320)">
    <rect width="115" height="36" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,82,82,0.3)"/>
    <text x="57" y="23" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#ff8a80" text-anchor="middle">SQL + PANDAS</text>
  </g>
</svg>
